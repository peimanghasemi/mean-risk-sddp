[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mrsddp"
version = "0.1.0"
description = "Time-consistent mean-risk policies for multi-stage stochastic linear programs"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Peiman Ghasemi" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.11"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
